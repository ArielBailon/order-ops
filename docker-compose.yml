services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orderops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderops
      POSTGRES_PASSWORD: orderops
      POSTGRES_DB: orderops
    ports:
      - "5432:5432"
    volumes:
      - orderops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderops -d orderops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orderops-pgdata:
